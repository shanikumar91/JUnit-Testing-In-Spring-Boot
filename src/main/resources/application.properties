spring.application.name=productslist
spring.datasource.url=jdbc:mysql://localhost:3306/mydb
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Optional (Hibernate/JPA settings)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8180/realms/master/protocol/openid-connect/certs

#logging.level.root=INFO
#logging.level.org.springframework.web=DEBUG
logging.level.com.springbootproject.productslist=INFO

logging.config=classpath:logback-spring.xml

management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always